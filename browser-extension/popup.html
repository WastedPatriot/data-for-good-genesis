<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DataForEarth Carbon Tracker</title>
  <style>
    body {
      width: 380px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #1a4d2e 0%, #0f2419 100%);
      color: white;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #4ade80;
    }
    .subtitle {
      font-size: 12px;
      color: #86efac;
      margin-top: 4px;
    }
    .company-section {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .company-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .co2-amount {
      font-size: 32px;
      font-weight: bold;
      color: #fbbf24;
      margin: 8px 0;
    }
    .sustainability-score {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 8px;
    }
    .score-high { background: #22c55e; color: white; }
    .score-medium { background: #eab308; color: white; }
    .score-low { background: #ef4444; color: white; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      padding: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
    }
    .stat-label {
      color: #86efac;
      font-size: 12px;
    }
    .stat-value {
      font-weight: bold;
    }
    .no-data {
      text-align: center;
      padding: 32px 16px;
      color: #86efac;
    }
    .disclaimer {
      background: rgba(251, 191, 36, 0.1);
      border-left: 3px solid #fbbf24;
      padding: 12px;
      margin: 16px 0;
      font-size: 11px;
      color: #fde68a;
      border-radius: 4px;
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #86efac;
      margin-top: 16px;
    }
    .footer a {
      color: #4ade80;
      text-decoration: none;
    }
    .btn {
      background: #4ade80;
      color: #1a4d2e;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 8px;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #22c55e;
      transform: translateY(-1px);
    }
    .stats-summary {
      background: rgba(74, 222, 128, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
    }
    .stats-title {
      font-size: 12px;
      color: #86efac;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🌍 DataForEarth</div>
    <div class="subtitle">Company Carbon Tracker - Free Extension</div>
  </div>

  <div id="content">
    <div class="no-data">Loading...</div>
  </div>

  <div class="disclaimer">
    <strong>Privacy Notice:</strong> This extension collects anonymous usage data (domains visited, time spent) to help companies understand their environmental impact. No personal information is collected.
  </div>

  <button class="btn" id="downloadBtn">Download Your Carbon Data</button>

  <div class="footer">
    Free forever • No sign-up required • <a href="https://492e7fd1-6e30-483a-bddd-e3199d936946.lovableproject.com" target="_blank">Learn More</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
